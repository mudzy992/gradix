# CI tok 3/5 — unos BEZ mreže: zapis ostaje na telefonu + offline čitanje iz keša.
#
# Mrežu ISKLJUČUJE skripta emulator-net.sh PRIJE ovog toka (avionski režim na
# emulatoru, ne ručno). Prijava je obavljena u toku 02, a app OSTAJE ŽIVA —
# orkestrator ovaj tok pokreće u „nastavi" režimu („+"): forma „Moj dan" iz
# toka 02 ostaje MONTIRANA s učitanim podacima. I remount i hladni start su
# offline nemogući: load() forme zove me()/myProjects()/machines() pa bi novi
# mount ostavio prazan spisak projekata (save bi rekao „Izaberi projekat." —
# run 43821193657), a bootstrap zove me() prije home ekrana (run 43769430158:
# „Moj dan" nije vidljiv ni nakon 45 s). Tok 02 je ostavio formu skrolanu do
# dugmeta „Sačuvaj na telefon" — ovaj tok nastavlja OD TU, bez ikakvog
# resetiranja (retry također — RN stanje forme ostaje živo).
# Vremena se NE tipkaju — polja imaju validne defaulte (07:30–15:30), a manje
# koraka = manje mjesta za lažne padove.
#
# LAYOUT činjenice (sve ekrane je duža od vidljivog dijela): na formi „Moj dan"
# su dugmad na dnu prve kartice, poruka (message) odmah ISPOD dugmadi, a status
# „Čeka slanje" u kartici „Moji zapisi" još niže — DO SVEGA (dugmadi, poruka,
# statusa) se SKROLA DOLJE, jedna po jedna. Na ekranima
# rokova/projekata je „Osvježi" na dnu, a poruka „Nema veze…" na VRHU — poslije
# skrola do dugmeta poruka nije u vidiku pa se vraćamo skrolom GORE
# (direction: UP; re-mount bi obrisao poruku iz stanja ekrana).
appId: ba.gradix.teren
name: offline-unos
---
# Forma je VEĆ otvorena (tok 02 ju je ostavio ovdje) — „Sačuvaj na telefon"
# je van folda, skrolamo do njega (dokaz da je forma tu; na svježoj formi iz
# toka 02 dugme je već u vidiku pa skrol prođe odmah).
- scrollUntilVisible:
    element:
      text: "Sačuvaj na telefon"
    timeout: 20000
- tapOn: "Sačuvaj na telefon"
# Poruka poslije save-a je ISPOD oba dugmeta — poslije scrolla do dugmeta je
# van folda (run 43826875691: asercija pala iako je save prošao). Zato se i
# do poruke skrola; takeScreenshot je i pauza da RN zapiše u SQLite.
- takeScreenshot: offline-unos-sacuvao
- scrollUntilVisible:
    element:
      text: "Sačuvano na telefonu\. Pošalji kad bude veze\."
    timeout: 20000
- assertVisible:
    text: "Sačuvano na telefonu\. Pošalji kad bude veze\."
# Dugmad su iznad poruke — vratimo se do „Pošalji sada" (ako je u vidiku,
# skrol je no-op).
- scrollUntilVisible:
    element:
      text: "Pošalji sada"
    direction: UP
    timeout: 20000
- tapOn: "Pošalji sada"
# Offline: slanje pada, zapis OSTAJE u redu — poruka zamjenjuje staru na
# istom mjestu (ispod dugmadi), pa je već u vidiku; skrol zbog sigurnosti.
- takeScreenshot: offline-unos-poslao-pokusao
- scrollUntilVisible:
    element:
      text: "Nema veze sa serverom\. Zapisi ostaju na telefonu i poslaće se kasnije\."
    timeout: 20000
- assertVisible:
    text: "Nema veze sa serverom\. Zapisi ostaju na telefonu i poslaće se kasnije\."
# Status „Čeka slanje" je u kartici „Moji zapisi", još niže — skrolamo do njega.
- scrollUntilVisible:
    element:
      text: "Čeka slanje"
    timeout: 20000
- takeScreenshot: offline-unos-ceka
# Offline čitanje: rokovi i projekti iz keša (osvježeni u toku 02), uz jasnu
# poruku. „Osvježi" je na dnu spiska — skrolamo do njega prije tapinga.
- back
- tapOn: "Moji rokovi"
- scrollUntilVisible:
    element:
      text: "Osvježi"
    timeout: 20000
- tapOn: "Osvježi"
# Offline refresh odmah pada, ali prije povratka na vrh pričekajmo da dugme
# izađe iz „Osvježavam…" stanja (takeScreenshot = pauza za RN).
- takeScreenshot: offline-rokovi-refresh
- extendedWaitUntil:
    notVisible: "Osvježavam…"
    timeout: 15000
# Poruka „Nema veze. Prikazujem zadnje preuzeto." je na VRHU spiska — poslije
# skrola do dugmeta nije u vidiku, pa skrolamo GORE do nje.
- scrollUntilVisible:
    element:
      text: "Nema veze\. Prikazujem zadnje preuzeto\."
    direction: UP
    timeout: 20000
- assertVisible:
    text: "Nema veze\. Prikazujem zadnje preuzeto\."
- takeScreenshot: offline-rokovi-iz-kesa
- back
- tapOn: "Moji projekti"
- scrollUntilVisible:
    element:
      text: "Osvježi"
    timeout: 20000
- tapOn: "Osvježi"
- takeScreenshot: offline-projekti-refresh
- extendedWaitUntil:
    notVisible: "Osvježavam…"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Nema veze\. Prikazujem zadnje preuzeto\."
    direction: UP
    timeout: 20000
- assertVisible:
    text: "Nema veze\. Prikazujem zadnje preuzeto\."
- takeScreenshot: offline-projekti-iz-kesa
- back
