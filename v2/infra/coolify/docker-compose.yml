# Gradix v2 — Coolify (testna domena gradix.ba101.top)
#
# OVAJ FAJL JE ZA COOLIFY, NE ZA LOKALNI RAZVOJ.
#   putanja u repou:  v2/infra/coolify/docker-compose.yml
#   u Coolifyju:      Base Directory = /v2   (korijen v2 radnog stabla)
#                     Docker Compose Location = /infra/coolify/docker-compose.yml
#
# Šta ovdje NEMA i zašto:
#   * nema Postgres servisa — baza je eksterni PostgreSQL na mreži `db_net` (v1 D-021).
#   * nema Redis servisa ni Redis CA mounta — u Fazi 1 nijedan dio koda ne čita REDIS_*.
#     Mount je ranije postojao „za svaki slučaj“ i RUŠIO je deploy kad tog fajla nema
#     (`bind source path does not exist`). Vraća se kad Redis zaista bude potreban.
#   * nema MinIO-a — dolazi u R5 (ADR 0006).
#   * nema port mappinga — Coolify upravlja rutiranjem; `ports:` bi zaobišao TLS proxy.
#
# Tajne: NIJEDNA vrijednost nije u ovom fajlu. Sve dolazi iz Coolify environment
# varijabli resource-a (šablon: v2/.env.example).
services:
  web:
    build:
      # VAŽNO — kako Coolify razrješava putanje (provjereno na grešci iz deploya):
      # `context` i `dockerfile` se odnose na BASE DIRECTORY, ne na lokaciju ovog fajla.
      # Coolify pokreće `docker compose --project-directory <base>` gdje je <base> = /v2.
      context: .
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Coolify postavlja SERVICE_FQDN_WEB sam kad u UI-ju dodaš domenu i port.
      SERVICE_FQDN_WEB: ${SERVICE_FQDN_WEB:-}
      # --- obavezno (bez ovoga kontejner ne starta, namjerno) ---
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL mora biti postavljen u Coolifyju}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET mora biti postavljen u Coolifyju (min 32 znaka)}
      # --- ponašanje ---
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PGSSLMODE: ${PGSSLMODE:-verify-full}
      TZ: ${TZ:-Europe/Sarajevo}
    volumes:
      # CA kojim se provjerava TLS prema Postgresu — JEDINI mount koji Faza 1 koristi.
      # Coolify ga drži na hostu, a `sslrootcert` u DATABASE_URL ga traži unutar kontejnera.
      # Može se ugasiti prekidačem: POSTGRES_CA_MOUNT=false (npr. ako je baza bez TLS-a
      # ili je CA već u sistemskom trust storeu slike). Tada u DATABASE_URL treba
      # `sslmode=disable` ili `require`, i NE smije stajati `sslrootcert=`.
      - type: bind
        source: ${POSTGRES_CA_FILE:-/data/coolify/ssl/coolify-ca.crt}
        target: /etc/ssl/certs/coolify-ca.crt
        read_only: true
        bind:
          create_host_path: ${POSTGRES_CA_MOUNT_CREATE_PATH:-false}
    networks:
      - default
      # Eksterne mreže: baza živi na postojećoj mreži hosta (v1 D-021).
      # `redis_net` se dodaje kad Redis zaista uđe u upotrebu.
      - db_net
    # Coolify proxy traži da port bude izložen iz kontejnera; javni domen se dodaje
    # u UI-ju (https://gradix.ba101.top → 3000).
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Kad servis navede `networks:`, default mreža se više ne dodaje automatski —
  # zato je eksplicitno ovdje. NAMJERNO bez `name:`: Coolifyjev proxy očekuje
  # `<project>_default`; preimenovanje bi prekinulo rutiranje do kontejnera.
  default:
  # Postojeća mreža na hostu. Compose je NE kreira (v1 D-021).
  db_net:
    external: true
