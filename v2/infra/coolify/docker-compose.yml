# Gradix v2 staging — Coolify Docker Compose resource.
# Base Directory: /v2  |  Compose file: /infra/coolify/docker-compose.yml
# Secrets are supplied in Coolify only; this file contains names/defaults, never secret values.
services:
  web:
    build:
      # Coolify resolves both paths against Base Directory (/v2), not the compose file directory.
      context: .
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      SERVICE_FQDN_WEB: ${SERVICE_FQDN_WEB:-}
      # Database: required app principal plus optional separate migrator.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL mora biti postavljen u Coolifyju}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET mora biti postavljen u Coolifyju (min 32 znaka)}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PGSSLMODE: ${PGSSLMODE:-verify-full}
      TZ: ${TZ:-Europe/Sarajevo}
      # App-side S3 client: internal endpoint for server I/O; public endpoint for signed browser URLs.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: gradix-stg
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # Diagnostic target and MinIO bucket CORS origin; not a MinIO server credential.
      MINIO_CORS_ALLOWED_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGIN:-https://gradix.ba101.top}
      # Redis is informational today; rate limiting remains PostgreSQL-backed.
      REDIS_HOST: ${REDIS_HOST:-redis-core}
      REDIS_PORT: ${REDIS_PORT:-6380}
      REDIS_USER: ${REDIS_USER:-gradix_v2}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-gradix:stg:}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-/etc/ssl/certs/redis/redis-ca.crt}
    volumes:
      # PostgreSQL CA: host source -> stable in-container path used in DATABASE_URL.
      - type: bind
        source: ${POSTGRES_CA_FILE:-/data/coolify/ssl/coolify-ca.crt}
        target: /etc/ssl/certs/coolify-ca.crt
        read_only: true
        bind:
          create_host_path: ${POSTGRES_CA_MOUNT_CREATE_PATH:-false}
      # Redis CA directory mount: missing cert does not prevent the app container starting.
      # The diagnostic distinguishes an absent in-container CA from TLS/auth/network failures.
      # Host: /data/coolify/ssl/redis-core/redis-ca.crt
      # Container: /etc/ssl/certs/redis/redis-ca.crt
      - type: bind
        source: /data/coolify/ssl/redis-core
        target: /etc/ssl/certs/redis
        read_only: true
        bind:
          create_host_path: true
    networks:
      - default
      - db_net
      - redis_net
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Staging-only MinIO; persistent host data stays isolated from v1 storage.
  # Prepare the host directory and migrate any existing named-volume data before deploying.
  minio:
    image: ghcr.io/coollabsio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      SERVICE_FQDN_MINIO: ${SERVICE_FQDN_MINIO:-}
    volumes:
      - type: bind
        source: /mnt/shared-app-files/gradix-v2/minio
        target: /data
        bind:
          create_host_path: false
    networks:
      - default
    expose:
      - "9000"

  # One-shot bootstrap. Web does not depend on this service, so a MinIO outage never gates app startup.
  minio-init:
    image: minio/mc:RELEASE.2025-10-15T17-29-55Z
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: on-failure
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: gradix-stg
      MINIO_CORS_ALLOWED_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGIN:-https://gradix.ba101.top}
    volumes:
      # Paths are relative to the Coolify project directory (/v2), as for the web build context.
      - ./infra/minio/init-staging.sh:/init.sh:ro
      - ./infra/minio/staging-policy.json:/policy.json:ro
    networks:
      - default

networks:
  # Keep Coolify's default stack network for proxy routing and minio service DNS.
  default:
  # Existing external infrastructure networks; Compose does not create them.
  db_net:
    external: true
  redis_net:
    external: true
