# Gradix v2 — Coolify (testna domena gradix.ba101.top)
#
# OVAJ FAJL JE ZA COOLIFY, NE ZA LOKALNI RAZVOJ.
#   putanja u repou:  v2/infra/coolify/docker-compose.yml
#   u Coolifyju:      Base Directory = /v2   (korijen v2 radnog stabla)
#                     Docker Compose Location = /infra/coolify/docker-compose.yml
#
# Šta ovdje NEMA i zašto:
#   * nema Postgres servisa — baza je već na serveru (Coolify resource), baza `gradix`,
#     korisnik `gradix_app`. Contejner se na nju spaja kroz DATABASE_URL.
#   * nema MinIO/Redis — u Fazi 1 se ne koriste (ADR 0006, STATUS.md).
#   * nema port mappinga — Coolify upravlja rutiranjem preko interneta kontejnera;
#     izlaganje porta hostu bi zaobišlo Coolifyjev TLS proxy.
#
# Tajne: NIJEDNA vrijednost nije u ovom fajlu. Sve dolazi iz Coolify environment
# varijabli resource-a (šablon: v2/.env.example, sekcija "Coolify").
services:
  web:
    build:
      # VAŽNO — kako Coolify razrješava putanje (provjereno na grešci iz deploya):
      # `context` i `dockerfile` se odnose na BASE DIRECTORY, ne na lokaciju ovog fajla.
      # Coolify pokreće `docker compose --project-directory <base>` gdje je <base> = /v2, pa:
      #   context: .            → /v2                      (korijen monorepa = ono što Dockerfile traži)
      #   dockerfile: infra/... → /v2/infra/docker/...     (relativno na context)
      # Prije je stajalo `../..`, što je iz /v2 otišlo u /artifacts i build je padao sa
      # "resolve : lstat /artifacts/infra: no such file or directory".
      context: .
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # --- obavezno (bez ovoga kontejner ne starta, namjerno) ---
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL mora biti postavljen u Coolifyju}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET mora biti postavljen u Coolifyju (min 32 znaka)}
      # --- ponašanje ---
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # Coolify postavlja SERVICE_FQDN_WEB sam kad u UI-ju dodaš domenu i port.
      SERVICE_FQDN_WEB: ${SERVICE_FQDN_WEB:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PGSSLMODE: ${PGSSLMODE:-prefer}
      TZ: ${TZ:-Europe/Sarajevo}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Coolify proxy traži da port bude izložen iz kontejnera; javni domen se dodaje
    # u UI-ju (https://gradix.ba101.top → 3000). Bez `ports:` — TLS i rutiranje su
    # Coolifyjev posao, a direktno izlaganje na host bi ga zaobišlo.
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
