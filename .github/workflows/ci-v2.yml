name: CI (v2)

# Zašto je ovaj fajl u KORIJENU repoa: GitHub Actions čita isključivo
# `.github/workflows/` u korijenu. Dok je bio u `v2/.github/workflows/`, v2 CI se
# NIKAD nije pokrenuo (391 run je bio v1). Radni direktorij v2 zato stoji u svakom koraku.
#
# Brzina je uslov: cilj je pregled svake promjene ispod 10 minuta.
# Teški testovi (mobilni E2E na emulatoru) idu u noćni pokret kad budu postojali.
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "v2/**"
      - ".github/workflows/ci-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://gradix_app:app@127.0.0.1:5432/gradix
  DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/gradix
  AUTH_SECRET: ci-placeholder-secret-min-32-characters

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Instalacija
        working-directory: v2
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: v2
        run: pnpm lint

      - name: Typecheck
        working-directory: v2
        run: pnpm typecheck

      # Ugovor: `openapi.json` je generisan iz šema. Ako se šema promijeni a dokument ne,
      # klijent se zakuca na stari ugovor i to se vidi tek na uređaju.
      # Vlasnička odluka: repo sadrži samo sintetičke podatke. Provjera ide prije testova —
      # JMBG ili strani email u seedu bi prošao testove i otišao u repo.
      - name: Nema stvarnih ličnih podataka
        working-directory: v2
        # Samoprovjera prvo: pravilo koje ne padne na stvarni JMBG izgleda kao zaštita, a nije.
        run: |
          node infra/scripts/check-privacy.mjs --self-test
          pnpm check-privacy

      - name: OpenAPI je ažuran
        working-directory: v2
        run: pnpm --filter @gradix/contracts check

      - name: Expo verzije (native bundle ne pada tek na telefonu)
        working-directory: v2
        # Bez mreže: čita bundledNativeModules.json iz instaliranog `expo`.
        # Hvata slučaj react-native !== ono što SDK traži — `expo export -p web` to propusti.
        run: pnpm check-expo

      - name: Migracije i role
        working-directory: v2
        run: |
          psql "$DATABASE_ADMIN_URL" -q -c "CREATE ROLE gradix_app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS" || true
          ./infra/scripts/db-apply.sh

      # Isti runtime preflight, kao DATABASE_URL aplikacijska rola (gradix_app), prije testova.
      # Time CI čita isti skup katalogâ kao staging, a ne administratorsku DATABASE_ADMIN_URL.
      - name: Runtime preflight (RLS, aplikacijska rola, preklapanje, scope default)
        working-directory: v2
        run: ./packages/db/preflight-checks/run.sh

      - name: Testovi (jedinični + integracijski na pravoj bazi)
        working-directory: v2
        run: pnpm test

      # Zaštita preklapanja dodjela ima DVA nosioca i biraju se pri migraciji (ima li btree_gist).
      # Jedan test zato ne može pokriti oba: ovaj korak vrti oba puta (prinudni fallback i stvarni)
      # i tvrdi koji je mehanizam ostao aktivan. Bez njega fallback put nikad nije izvršen u CI-ju.
      - name: Preklapanje dodjela — oba mehanizma (triger i EXCLUDE)
        working-directory: v2
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          DATABASE_URL_APP: postgresql://gradix_app:app@127.0.0.1:5432/gradix
        run: pnpm --filter @gradix/web check-preklapanje

      # R1c kapija: pristupačnost i tastatura nisu ručna provjera. Isti testovi su dio
      # `pnpm test`; ovaj korak ih imenuje da u CI-ju bude VIDLJIV zelen a11y, a ne skriven
      # u zbirnom broju. Pad ovdje znači: ekran ili okvir ima serious/critical nalaz.
      - name: Pristupačnost i tastatura (axe, WCAG 2.1 AA)
        working-directory: v2
        run: pnpm test:a11y

      - name: Prisma generator (dokaz da radi u CI-ju)
        working-directory: v2/packages/db
        # ADR 0002: lokalno je generator blokiran (nema pristupa binaries.prisma.sh), u CI-ju
        # mora raditi. Greška se namjerno podiže i kao ANOTACIJA: logovi runa nisu dostupni
        # svim klijentima, a anotacije jesu — bez toga ovaj korak ne daje upotrebljiv signal.
        run: |
          set +e
          pnpm exec prisma generate 2>&1 | tee /tmp/prisma.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::prisma generate pao (exit $code)"
            tail -n 12 /tmp/prisma.log | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=prisma generate::$line"
            done
          fi
          exit "$code"
        shell: bash

      - name: Provjera da migracija radi na praznoj bazi
        working-directory: v2
        run: |
          psql "$DATABASE_ADMIN_URL" -q -c "DROP DATABASE IF EXISTS gradix_check" -c "CREATE DATABASE gradix_check"
          DATABASE_ADMIN_URL="${DATABASE_ADMIN_URL%/*}/gradix_check" ./infra/scripts/db-apply.sh
