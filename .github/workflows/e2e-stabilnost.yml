# E2E stabilnost (R4a-2/A) — ručni workflow, NIJE kapija.
# Mjeri koliko često E2E zaista pada: N uzastopnih pokretanja, svako BEZ
# retryja (`--retries=0`), bez skrivanja. Svaki pad ostaje pad i ulazi u
# izvještaj s imenom testa; workflow je crven ako je ijedno pokretanje palo.
# Uzroci iz prethodnih padova su adresirani strukturno:
#   - preglednik: cache (~/.cache/ms-playwright) ključan zaključanom
#     verzijom (@playwright/test 1.57.0 u pnpm-lock.yaml), instalacija samo
#     chromium, bez `--with-deps` u petlji;
#   - GitHub API rate limit: ovaj workflow ne zove API u petlji.
name: E2E stabilnost (ručno, nije kapija)

on:
  workflow_dispatch:
    inputs:
      broj_pokretanja:
        description: "Koliko puta pokrenuti cijeli E2E skup (bez retryja)"
        required: false
        default: "20"

env:
  DATABASE_URL: postgresql://gradix_app:app@127.0.0.1:5432/gradix
  DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/gradix
  AUTH_SECRET: ci-placeholder-secret-min-32-characters

jobs:
  stabilnost:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Instalacija
        working-directory: v2
        run: pnpm install --frozen-lockfile

      # Preglednik iz cachea; ključ veže zaključanu verziju Playwrighta pa se
      # binarni preglednik ne skida ispočetka pri svakom pokretanju.
      - name: Cache Playwright preglednika (pinovana verzija iz lockfilea)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('v2/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Instalacija preglednika (samo ako cache promaši)
        working-directory: v2/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Migracije i role
        working-directory: v2
        run: |
          psql "$DATABASE_ADMIN_URL" -q -c "CREATE ROLE gradix_app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS" || true
          ./infra/scripts/db-apply.sh

      - name: Seed i build
        working-directory: v2
        env:
          E2E_PASSWORD: E2eDemoLozinka-123
          SEED_PASSWORD: E2eDemoLozinka-123
          PLATFORM_ADMIN_EMAILS: vlasnik@demo.ba
        run: |
          pnpm --filter @gradix/web seed
          pnpm --filter @gradix/web build

      - name: Mjerenje — N pokretanja bez retryja
        working-directory: v2/apps/web
        env:
          E2E_PASSWORD: E2eDemoLozinka-123
          BROJ: ${{ inputs.broj_pokretanja }}
        run: |
          set -u
          mkdir -p /tmp/e2e-stabilnost
          (pnpm start > /tmp/e2e-stabilnost/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/login >/dev/null && break || sleep 2; done
          curl -sf http://127.0.0.1:3000/login >/dev/null || { echo "Server se nije digao"; tail -n 40 /tmp/e2e-stabilnost/server.log; exit 1; }

          ukupno="${BROJ:-20}"
          proslo=0
          palo=0
          : > /tmp/e2e-stabilnost/sazetak.txt
          for n in $(seq 1 "$ukupno"); do
            log="/tmp/e2e-stabilnost/run-$n.log"
            if pnpm exec playwright test --retries=0 --reporter=list > "$log" 2>&1; then
              echo "run $n: PASS" >> /tmp/e2e-stabilnost/sazetak.txt
              proslo=$((proslo+1))
            else
              echo "run $n: FAIL" >> /tmp/e2e-stabilnost/sazetak.txt
              grep -E "›.*(failed|✘)|Error:" "$log" | head -5 >> /tmp/e2e-stabilnost/sazetak.txt || true
              palo=$((palo+1))
            fi
          done

          {
            echo "## E2E stabilnost"
            echo ""
            echo "- Pokretanja: $ukupno (svako bez retryja)"
            echo "- Prošlo: $proslo"
            echo "- Palo: $palo"
            echo ""
            echo '```'
            cat /tmp/e2e-stabilnost/sazetak.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/e2e-stabilnost/sazetak.txt
          echo "UKUPNO=$ukupno PROSLO=$proslo PALO=$palo"
          # Padovi se ne skrivaju: ijedan pad = crven workflow.
          [ "$palo" -eq 0 ]

      - name: Izvještaj kao artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stabilnost-izvjestaj
          path: /tmp/e2e-stabilnost
          retention-days: 14
          if-no-files-found: ignore
