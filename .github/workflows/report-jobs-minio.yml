name: Report jobs MinIO integration
on:
  push:
    branches: [main, 'arena/**']
    paths: ['v2/**', '.github/workflows/report-jobs-minio.yml']
  pull_request:
    branches: [main]
    paths: ['v2/**', '.github/workflows/report-jobs-minio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gradix_app:app@127.0.0.1:5432/gradix
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/gradix
      AUTH_SECRET: ci-placeholder-secret-min-32-characters
      REPORT_FLOW_MINIO_ENDPOINT: http://127.0.0.1:9000
      REPORT_FLOW_MINIO_ACCESS_KEY: reportflowtest
      REPORT_FLOW_MINIO_SECRET_KEY: reportflowtestsecret
      REPORT_FLOW_MINIO_BUCKET: gradix-report-flow-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - name: Install
        working-directory: v2
        run: pnpm install --frozen-lockfile
      - name: Test role and MinIO bucket
        working-directory: v2
        run: |
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE gradix_app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS"
          docker run -d --name report-flow-minio -p 9000:9000 -e MINIO_ROOT_USER="$REPORT_FLOW_MINIO_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$REPORT_FLOW_MINIO_SECRET_KEY" ghcr.io/coollabsio/minio:latest server /data 2>/tmp/report-minio-error || { echo "::error::MinIO docker: $(tail -4 /tmp/report-minio-error | tr "\n" " ")"; exit 1; }
          for i in $(seq 1 60); do curl -fsS "$REPORT_FLOW_MINIO_ENDPOINT/minio/health/ready" >/dev/null && break; sleep 1; done
          cd apps/web
          node --input-type=module -e 'import {S3Client,CreateBucketCommand} from "@aws-sdk/client-s3"; const c=new S3Client({endpoint:process.env.REPORT_FLOW_MINIO_ENDPOINT,region:"us-east-1",forcePathStyle:true,credentials:{accessKeyId:process.env.REPORT_FLOW_MINIO_ACCESS_KEY,secretAccessKey:process.env.REPORT_FLOW_MINIO_SECRET_KEY}}); await c.send(new CreateBucketCommand({Bucket:process.env.REPORT_FLOW_MINIO_BUCKET})); c.destroy();'
      - name: POST → worker → real MinIO → notification → download
        working-directory: v2
        run: pnpm --filter @gradix/web exec vitest run src/server/report-job-flow.integration.test.ts
