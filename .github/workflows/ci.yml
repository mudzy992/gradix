name: CI

# Pokreće se na main, na svim arena/* granama i na svakom PR-u.
on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Backend: instalacija, Prisma generate, lint, unit testovi, build
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # `prisma generate` čita DATABASE_URL iz prisma.config.ts (bez konekcije)
      DATABASE_URL: postgresql://root:root@localhost:5432/gradix?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: gradix
      MINIO_SKIP: 'true'
      CORS_ORIGIN: http://127.0.0.1:4173
      SEED_PASSWORD: GradixSeed1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalacija zavisnosti
        run: npm ci --no-audit --no-fund

      - name: Prisma client
        run: npx prisma generate

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit testovi
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

      - name: Provjeri ulazne tačke builda (API + seed)
        run: |
          test -f dist/src/main.js
          # Seed mora biti kompajliran u dist — u produkciji se pokreće sa
          # `node dist/prisma/seed.js` (bez `tsx` i bez dev zavisnosti).
          test -f dist/prisma/seed.js

  # ---------------------------------------------------------------------------
  # Backend E2E (NestJS + PostgreSQL)
  # ---------------------------------------------------------------------------
  backend-e2e:
    name: Backend (e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gradix
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d gradix"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://root:root@localhost:5432/gradix?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: gradix
      MINIO_SKIP: 'true'
      CORS_ORIGIN: http://127.0.0.1:4173
      SEED_PASSWORD: GradixSeed1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npx prisma generate

      - name: Migracije
        run: npx prisma migrate deploy

      - name: Seed
        run: npx prisma db seed

      - name: E2E testovi
        run: |
          cat > /tmp/report-e2e.cjs <<'REPORT'
          const fs = require('fs');
          const path = '/tmp/e2e-report.json';
          if (!fs.existsSync(path)) {
            console.log('::error::Jest nije proizveo JSON izvještaj — provjeri prethodni korak.');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const failed = [];
          for (const file of report.testResults) {
            for (const test of file.assertionResults) {
              if (test.status === 'failed') {
                failed.push({
                  file: file.name.replace(`${process.cwd()}/`, ''),
                  title: test.fullName,
                  message: (test.failureMessages || []).join(' ').replace(/\s+/g, ' ').slice(0, 900),
                });
              }
            }
          }
          console.log(`Ukupno testova: ${report.numTotalTests}, palo: ${failed.length}`);
          for (const item of failed.slice(0, 10)) {
            console.log(`::error file=${item.file}::${item.title} :: ${item.message}`);
          }
          process.exit(failed.length > 0 ? 1 : 0);
          REPORT
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js \
            --config ./test/jest-e2e.json \
            --json --outputFile=/tmp/e2e-report.json --forceExit || true
          node /tmp/report-e2e.cjs

  # ---------------------------------------------------------------------------
  # Frontend: lint, typecheck, build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Web E2E (Playwright: stvarni backend + buildani frontend kroz vite preview)
  # ---------------------------------------------------------------------------
  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gradix
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d gradix"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://root:root@localhost:5432/gradix?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: gradix
      MINIO_SKIP: 'true'
      CORS_ORIGIN: http://127.0.0.1:4173
      SEED_PASSWORD: GradixSeed1
      VITE_API_URL: ''
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      E2E_LOGIN_EMAIL: admin@gradix.local
      E2E_LOGIN_PASSWORD: GradixSeed1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — priprema baze i build
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run build
          npx prisma migrate deploy
          # Seed iz builda — identičan put kao u produkcijskoj slici
          # (`node dist/prisma/seed.js`), ne `tsx prisma/seed.ts`.
          node dist/prisma/seed.js

      - name: Backend — start
        working-directory: backend
        run: |
          nohup node dist/src/main.js > /tmp/nest.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Backend je spreman"
              exit 0
            fi
            sleep 2
          done
          echo "Backend nije startao:"; cat /tmp/nest.log; exit 1

      - name: Frontend — build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Playwright — instalacija browsera
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend — preview server
        working-directory: frontend
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              echo "Preview je spreman"
              exit 0
            fi
            sleep 1
          done
          echo "Vite preview nije startao:"; cat /tmp/vite-preview.log; exit 1

      - name: Playwright testovi
        working-directory: frontend
        run: npx playwright test

      - name: Logovi (na grešku)
        if: failure()
        run: |
          echo "=== backend ==="; tail -100 /tmp/nest.log || true
          echo "=== vite preview ==="; tail -50 /tmp/vite-preview.log || true

      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Docker / Coolify gate — build produkcijskih slika i smoke test kontejnera.
  # Ako je ovaj job zelen, Coolify build prolazi.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build (Coolify gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gradix
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d gradix"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Root Dockerfile-ovi moraju biti identični onima u app direktorijima
        run: |
          diff -u backend/Dockerfile Dockerfile
          diff -u frontend/Dockerfile Dockerfile.frontend

      - name: Docker Compose — validacija
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/gradix?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-min-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters
        run: |
          docker compose config --quiet
          # Coolify deploya blue/green (stari i novi kontejner kratko rade
          # paralelno) — fiksni host port tada pada sa
          # "address already in use". Servisi zato koriste samo `expose`.
          published=$(docker compose config --format json \
            | jq '[.services[] | (.ports // []) | length] | add // 0')
          echo "Objavljenih host portova: $published"
          if [ "$published" != "0" ]; then
            echo "::error::Compose objavljuje fiksne host portove — Coolify deploy će pasti sa 'address already in use'. Koristi 'expose'."
            exit 1
          fi
          # Eksterne mreže iz compose-a moraju biti deklarisane kao external
          networks=$(docker compose config --format json \
            | jq -r '[.networks | to_entries[] | select(.value.external == true) | .key] | join(", ")')
          echo "Eksterne mreže: $networks"
          # CA certifikati MORAJU biti mapirani u backend. Bez toga Prisma padne
          # u runtime-u: "ENOENT: open '/etc/ssl/certs/coolify-ca.crt'".
          bind_targets=$(docker compose config --format json \
            | jq -r '[.services.backend.volumes[]? | select(.type == "bind") | .target] | join(",")')
          echo "Backend bind mountovi: $bind_targets"
          for target in /etc/ssl/certs/coolify-ca.crt /etc/ssl/redis/redis-ca.crt; do
            case ",$bind_targets," in
              *",$target,"*) ;;
              *)
                echo "::error::Backend ne mapira $target — TLS prema bazi/Redis-u pada u runtime-u."
                exit 1
                ;;
            esac
          done
          # MinIO podaci moraju ići na host (bind), ne u anonimni Docker volume.
          minio_volume=$(docker compose config --format json \
            | jq -r '.services.minio.volumes[]? | select(.target == "/data") | "\(.type) \(.source)"')
          echo "MinIO /data → $minio_volume"
          case "$minio_volume" in
            bind\ \/*) ;;
            *)
              echo "::error::MinIO /data nije bind mount na host putanju (nađeno: '$minio_volume')."
              exit 1
              ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - name: Build backend slike
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: gradix-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend slike
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: gradix-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Preflight — nepostojeći SSL CA mora stati odmah
        # Regresija koju hvatamo: bez preflighta Prisma padne tek pri prvom
        # upitu sa "ENOENT: open '/etc/ssl/certs/coolify-ca.crt'".
        run: |
          set +e
          out=$(docker run --rm \
            -e DATABASE_URL='postgresql://u:p@127.0.0.1:5432/gradix?sslmode=verify-ca&sslrootcert=/etc/ssl/certs/nope.crt' \
            -e JWT_ACCESS_SECRET=ci-access-secret-min-32-characters \
            -e JWT_REFRESH_SECRET=ci-refresh-secret-min-32-characters \
            gradix-backend:ci 2>&1)
          code=$?
          set -e
          echo "$out" | tail -8
          if [ "$code" -eq 0 ]; then
            echo "::error::Kontejner je nastavio rad iako CA fajl ne postoji — SSL preflight ne radi."
            exit 1
          fi
          echo "$out" | grep -q "GREŠKA: DATABASE_URL zahtijeva CA" || {
            echo "::error::Preflight nije ispisao očekivanu poruku o CA fajlu."
            exit 1
          }
          echo "Preflight OK — kontejner je stao sa jasnom porukom."

      - name: Seed iz produkcijske slike (dist/prisma/seed.js)
        # Dokaz da seed radi u PRODUKCIJSKOJ slici: `npm ci --omit=dev`, bez
        # `tsx` i bez TypeScript izvora. Entrypoint prvo pokrene
        # `prisma migrate deploy`, pa seed — isti put kao na Coolifyju.
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/gradix?schema=public
          SEED_PASSWORD: GradixSeed1
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SEED_PASSWORD="$SEED_PASSWORD" \
            gradix-backend:ci node dist/prisma/seed.js
          docker run --rm --network host --entrypoint node \
            -e DATABASE_URL="$DATABASE_URL" \
            gradix-backend:ci -e "
              const { Client } = require('pg');
              (async () => {
                const client = new Client({ connectionString: process.env.DATABASE_URL });
                await client.connect();
                const { rows } = await client.query('select count(*)::int as n from \"User\"');
                await client.end();
                console.log('Korisnika u bazi nakon seed-a:', rows[0].n);
                if (rows[0].n < 2) {
                  console.error('::error::Seed nije upisao ocekivane korisnike');
                  process.exit(1);
                }
              })().catch((error) => { console.error(error); process.exit(1); });
            "

      - name: MinIO servis iz compose-a (pull + healthcheck)
        # Coolify prije starta radi `docker compose pull` za image-based servise,
        # pa je nedostupna registry referenca tvrdi pad deploya
        # ("pull access denied for minio/minio"). Ovaj korak diže isti servis
        # iz docker-compose.yml i traži da postane `healthy`, čime se hvata i
        # mrtva referenca i pokvaren healthcheck.
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/gradix?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-min-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters
        run: |
          set -euo pipefail
          image=$(docker compose config --images | grep -i minio | head -1)
          if [ -z "$image" ]; then
            echo "::error::MinIO image referenca nije pronađena u docker-compose.yml"
            exit 1
          fi
          echo "MinIO image: $image"
          # Eksterne mreže postoje na produkcijskom hostu; u CI-ju ih kreiramo.
          docker network create db_net >/dev/null 2>&1 || true
          docker network create redis_net >/dev/null 2>&1 || true
          # MinIO sada piše na HOST putanju (bind mount). Na produkciji je to
          # /mnt/shared-app-files/gradix/minio; u CI-ju je kreiramo sa širokim
          # pravima jer je runner efemeralan.
          sudo mkdir -p /mnt/shared-app-files/gradix/minio
          sudo chmod 777 /mnt/shared-app-files/gradix/minio
          if ! docker compose up -d minio 2>&1 | tail -20; then
            echo "::error::docker compose up minio nije uspio za '$image'"
            exit 1
          fi
          status="unknown"
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$(docker compose ps -q minio)" 2>/dev/null || echo "starting")
            echo "status: $status ($i)"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 3
          done
          docker compose logs --tail 25 minio || true
          docker compose down
          if [ "$status" != "healthy" ]; then
            echo "::error::MinIO servis nije postao healthy (status: $status, image: $image)"
            exit 1
          fi
          echo "MinIO je healthy sa image-om: $image"

      - name: Frontend builder — Coolify emulacija (NODE_ENV=production)
        # Coolify u build ubacuje NODE_ENV=production kao build-arg. Bez
        # `npm ci --include=dev` npm tada preskoči devDependencies i build pada
        # sa "sh: vite: not found". Ovaj korak čuva tu regresiju.
        run: |
          docker build --target builder \
            --build-arg NODE_ENV=production \
            --build-arg VITE_API_URL= \
            -t gradix-frontend-builder:ci ./frontend
          docker run --rm gradix-frontend-builder:ci \
            node -e "require.resolve('vite/package.json'); console.log('vite je instaliran u builder stage-u')"

      - name: Smoke test — backend kontejner (migracije + /api/health)
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/gradix?schema=public
        run: |
          docker run -d --name gradix-backend-ci --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_ACCESS_SECRET=ci-access-secret-min-32-characters \
            -e JWT_REFRESH_SECRET=ci-refresh-secret-min-32-characters \
            -e MINIO_SKIP=true \
            -e MINIO_ENDPOINT=localhost \
            -e MINIO_PORT=9000 \
            -e MINIO_USE_SSL=false \
            -e MINIO_ACCESS_KEY=minioadmin \
            -e MINIO_SECRET_KEY=minioadmin \
            -e MINIO_BUCKET=gradix \
            -e CORS_ORIGIN=http://127.0.0.1:4173 \
            gradix-backend:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Backend kontejner je zdrav"
              curl -s http://127.0.0.1:3000/api/health; echo
              exit 0
            fi
            sleep 3
          done
          echo "Backend kontejner nije postao zdrav:"; docker logs gradix-backend-ci; exit 1

      - name: Smoke test — frontend kontejner (nginx + proxy na API)
        run: |
          docker run -d --name gradix-frontend-ci --network host \
            -e BACKEND_URL=http://127.0.0.1:3000 \
            gradix-frontend:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1/ > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1/ | grep -qi "<div id=\"root\"" || {
            echo "index.html nije ispravan"; docker logs gradix-frontend-ci; exit 1;
          }
          echo "--- proxy /api/health kroz nginx ---"
          curl -fsS http://127.0.0.1/api/health; echo

      - name: Logovi kontejnera (na grešku)
        if: failure()
        run: |
          docker logs gradix-backend-ci || true
          docker logs gradix-frontend-ci || true
          docker ps -a || true
