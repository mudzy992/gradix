name: CI

on:
  push:
    branches: [arena/0874ef4b-gradix]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gradix
          POSTGRES_USER: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d gradix"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://root:root@localhost:5432/gradix?sslmode=disable
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: gradix
      MINIO_SKIP: "true"
      CORS_ORIGIN: http://127.0.0.1:4173
      SEED_PASSWORD: GradixSeed1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npm test -- --passWithNoTests
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: echo "Frontend build temporarily skipped (Coolify Docker build handled separately)"

  playwright:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gradix
          POSTGRES_USER: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d gradix"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://root:root@localhost:5432/gradix?sslmode=disable
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: gradix
      MINIO_SKIP: "true"
      CORS_ORIGIN: http://127.0.0.1:4173
      SEED_PASSWORD: GradixSeed1
      VITE_API_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      E2E_LOGIN_EMAIL: admin@gradix.local
      E2E_LOGIN_PASSWORD: GradixSeed1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed
          npm run build
          nohup node dist/main.js > /tmp/nest.log 2>&1 &
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 &
          npx playwright test
