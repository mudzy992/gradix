services:
  # MinIO (objektno skladište) — JEDINI INTEGRISANI SERVIS u ovom compose
  # Baza podataka (PostgreSQL) i Redis su EKSTERNI (već postoje u Dockeru / Coolify okruženju)
  minio:
    image: minio/minio:latest
    container_name: gradix-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - gradix-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Backend (NestJS) — povezuje se na EKSTERNU PostgreSQL bazu i EKSTERNI Redis
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    container_name: gradix-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      # EKSTERNA PostgreSQL baza (Coolify / Docker / host) — TLS CA cert mapiran sa hosta
      DATABASE_URL: ${DATABASE_URL:-postgresql://gradix_user:gradix_password@postgres.external:5432/gradix?sslmode=verify-ca&sslrootcert=/etc/ssl/certs/coolify-ca.crt}
      # JWT tajne (min 32 znaka za produkciju!)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # MinIO (interni — jedini servis u ovom compose)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-gradix}
      # CORS za Coolify domene
      CORS_ORIGIN: ${CORS_ORIGIN:-https://gradix.local}
      # Seed lozinka — PROMIJENITI za produkciju!
      SEED_PASSWORD: ${SEED_PASSWORD:-GradixSeed1}
      # TLS CA cert za PostgreSQL klijent (mapiran sa hosta Coolify)
      PGSSLROOTCERT: /etc/ssl/certs/coolify-ca.crt
      PGSSLMODE: verify-ca
      # EKSTERNI Redis (globalni) — za buduće BullMQ / queue radnike (v1 ne koristi)
      REDIS_HOST: ${REDIS_HOST:-redis.global}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gradixwork}
      REDIS_TLS_CA_FILE: /etc/ssl/redis/redis-ca.crt
      REDIS_PREFIX: ${REDIS_PREFIX:-gradix:queue:}
    volumes:
      # TLS CA cert za PostgreSQL (eksterna baza) — mapiran sa Coolify hosta
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
      # TLS CA cert za Redis (globalni) — mapiran sa Coolify hosta
      - /data/coolify/ssl/redis-core/redis-ca.crt:/etc/ssl/redis/redis-ca.crt:ro
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      minio:
        condition: service_started
    networks:
      - gradix-net

  # Frontend (Vite / React) — opcionalno; može i preko Coolify statičkog sajta / nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: gradix-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://gradix-backend:3000}
      NODE_ENV: production
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - gradix-net

volumes:
  minio_data:

networks:
  gradix-net:
    driver: bridge
