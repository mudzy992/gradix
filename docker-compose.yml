# Gradix — produkcijski docker-compose (Coolify)
#
# Servisi:
#   minio     — objektno skladište (interni servis)
#   backend   — NestJS API (port 3000)
#   frontend  — Vite/React build serviran kroz nginx (port 80)
#
# EKSTERNO (ne pokreće se ovim compose fajlom):
#   PostgreSQL — u mreži `db_net` (obavezan `DATABASE_URL`)
#   Redis      — u mreži `redis_net` (opcionalno, v1 ne koristi queue)
#
# MREŽE:
#   gradix-net  — interna mreža projekta (frontend ↔ backend ↔ minio)
#   db_net      — EKSTERNA mreža u kojoj živi PostgreSQL (external: true)
#   redis_net   — EKSTERNA mreža u kojoj živi Redis (external: true)
#
# Obavezne env varijable (Coolify → Environment Variables):
#   (vidi .env.example / docs/INFRASTRUCTURE.md §5)
#
# HOST MAPIRANJA (bind):
#   /data/coolify/ssl/coolify-ca.crt        → /etc/ssl/certs/coolify-ca.crt (CA za bazu)
#   /data/coolify/ssl/redis-core/redis-ca.crt → /etc/ssl/redis/redis-ca.crt (CA za Redis)
#   /mnt/shared-app-files/gradix/minio      → /data (MinIO podaci)
# Override putanja: POSTGRES_CA_FILE, REDIS_CA_FILE, MINIO_DATA_DIR
#
# VAŽNO: servisi NE objavljuju fiksne host portove (`ports`), nego koriste
# `expose`. Coolify deploya blue/green (stari i novi kontejner kratko rade
# paralelno), pa fiksni host port padne sa:
#   "failed to bind host port 0.0.0.0:5173/tcp: address already in use"
# Coolify proxy dolazi do kontejnera preko Docker mreže, pa host portovi nisu
# potrebni. Ako ti ipak treba direktan pristup (npr. mobilna aplikacija na
# IP:3000), vidi docs/INFRASTRUCTURE.md §8.

services:
  minio:
    # MinIO community image više nije javno dostupan na Docker Hub-u
    # (`minio/minio`) ni na `quay.io/minio/minio` (401) — oba su ugašena/
    # privatizovana. Default je Coolify-jev mirror klasičnog MinIO servera
    # (testirano: S3 API na 9000 radi, `mc` postoji pa healthcheck prolazi).
    #
    # Alternativa (zvanični MinIO registry): quay.io/minio/aistor/minio:latest
    # Override bez izmjene koda: MINIO_IMAGE=<registry>/<repo>:<tag>
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    expose:
      # S3 API (backend) i web konzola (opciono — domen dodijeli u Coolifyju)
      - "9000"
      - "9001"
    volumes:
      # Podaci idu na HOST putanju (deljeni fajl sistem), ne u anonimni Docker
      # volume: lakše se backupira i preživljava `docker compose down -v`.
      # Override bez izmjene koda: MINIO_DATA_DIR=/neka/druga/putanja
      - "${MINIO_DATA_DIR:-/mnt/shared-app-files/gradix/minio}:/data"
    networks:
      - gradix-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Migracije se pokreću pri startu kontejnera (RUN_MIGRATIONS=false ih isključuje)
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # EKSTERNA PostgreSQL baza — hostname mora biti razrješiv u mreži `db_net`
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL je obavezan (postgresql://user:pass@host:5432/db)}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET je obavezan (min 32 znaka)}
      # MinIO — interni servis iz ovog compose fajla
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-gradix}
      # CORS — javni URL frontenda (prazno = dozvoljeni svi origin-i)
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      # Preflight u entrypointu: ako `DATABASE_URL` traži CA (`sslrootcert=...`)
      # a fajla nema u kontejneru, kontejner padne ODMAH sa jasnom porukom
      # (bez ovoga Prisma padne tek pri prvom upitu: "ENOENT ... coolify-ca.crt").
      SSL_PREFLIGHT: ${SSL_PREFLIGHT:-true}
      # EKSTERNI Redis (mreža `redis_net`) — opcionalno, v1 ne koristi queue
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-gradix:queue:}
      # CA za Redis (v1 kod ga ne čita, ali je fajl mapiran — vidi volumes)
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-/etc/ssl/redis/redis-ca.crt}
    expose:
      - "3000"
    volumes:
      # --- CA certifikati (Coolify ih drži na hostu) ---
      # DATABASE_URL koristi `sslrootcert=/etc/ssl/certs/coolify-ca.crt`, pa taj
      # fajl MORA postojati u kontejneru. Bez ovoga Prisma padne u runtime-u:
      #   ENOENT: no such file or directory, open '/etc/ssl/certs/coolify-ca.crt'
      #
      # `create_host_path: false` → ako putanja na hostu ne postoji, compose
      # padne sa "bind source path does not exist" umjesto da tiho napravi
      # direktorij (i maskira problem). Override: POSTGRES_CA_FILE=...
      - type: bind
        source: ${POSTGRES_CA_FILE:-/data/coolify/ssl/coolify-ca.crt}
        target: /etc/ssl/certs/coolify-ca.crt
        read_only: true
        bind:
          create_host_path: false
      # CA za Redis — Coolify: /data/coolify/ssl/redis-core/redis-ca.crt
      # Override: REDIS_CA_FILE=...
      - type: bind
        source: ${REDIS_CA_FILE:-/data/coolify/ssl/redis-core/redis-ca.crt}
        target: /etc/ssl/redis/redis-ca.crt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      # Backend sam ponavlja konekciju na MinIO (retry u MinioService),
      # pa healthcheck MinIO-a nije uslov za start.
      minio:
        condition: service_started
    networks:
      - gradix-net
      # Eksterne mreže: baza i Redis
      - db_net
      - redis_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Prazno = relativni /api i /socket.io pozivi kroz nginx proxy ispod.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    environment:
      # nginx prosljeđuje /api i /socket.io na ovaj URL (interno ime servisa)
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - gradix-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  gradix-net:
    driver: bridge
  # Postojeće mreže na hostu (Docker / Coolify) — moraju postojati prije deploya:
  #   docker network create db_net     (ako već ne postoji)
  #   docker network create redis_net
  db_net:
    external: true
  redis_net:
    external: true
